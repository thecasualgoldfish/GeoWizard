            function isAlpha(str) {
                return /^[A-Za-z]+$/.test(str);
            }

            function getName(countryNames)
            {
                const name = countryNames[Math.floor(Math.random() * countryNames.length)];
                return name;
            }

            function createWordSpace(name)
            {
                let wordSpace = [];
                for (let element of name)
                {
                    wordSpace.push(element);  
                }
                return wordSpace;
            }
            function createWord(name)
            {
                let word = [];
                for (let element of name)
                {
                    if (isAlpha(element))
                    {
                        word.push(element);  
                    }
                    else
                    {

                    }
                }
                return word;
            }
            function createRow(wordSpace)
            {
                const inputRow = document.querySelector("#input-row");
                let card;
                let block;
                let blocks = [];
                let space = [];
                let nextRow = document.createElement("div");
                nextRow.className = 'nextRow';
                for (let element of wordSpace)
                {
                    if (isAlpha(element))
                    {
                        card = document.createElement("div");
                        card.className = 'letter-box';
                        blocks.push(card);
                        nextRow.appendChild(card);   
                    } 
                    else
                    {
                        card = document.createElement("div");
                        card.className = 'letter-space';
                        space.push(card);
                        nextRow.appendChild(card);  
                    }
                }
                inputRow.appendChild(nextRow);
                return blocks;
            }
            function inputBox(blocks, name, word, input, round, message, hint, sorry, congrats, wordSpace, messagelength)
            {  
                
                input.oninput = function() {
                    input.value = input.value.replace(/\s/g, "");
                    var typedText = input.value.toUpperCase();
                    for (let character = 0; character < blocks.length; character++)
                    {
                        blocks[character].textContent = typedText[character] || "";  //Updates when user backspaces                      
                    } 
                }
                form.onsubmit = function(event){
                    event.preventDefault();
                    if (word.length != input.value.length)
                    {
                        messagelength.style.visibility = 'visible';
                        return;
                    }
                    let guess = input.value.toLowerCase().replace(/[^a-z]/g, "");
                    let validCountry = false;
                    for (let country of countryNames) {
                        if (country.replace(/[^a-z]/g, "") == guess)
                        {
                            validCountry = true;
                            break;
                        }
                    }
                    if (!validCountry) {
                        message.style.visibility = 'visible';
                        return;
                    }

                    message.style.visibility = 'hidden';
                    messagelength.style.visibility = 'hidden';

                    let remainingLetters = [];
                    let colors = [];

                    for (let idx = 0; idx < word.length; idx++) {
                        remainingLetters.push(word[idx].toLowerCase());
                        colors.push("gray");
                    }

                    for (let idx = 0; idx < guess.length; idx++) {
                        if (guess[idx] == word[idx].toLowerCase()) {
                            colors[idx] = "seagreen";
                            let matchIndex = remainingLetters.indexOf(guess[idx]);
                            remainingLetters.splice(matchIndex, 1);
                        }
                    }

                    for (let idx = 0; idx < guess.length; idx++) {
                        if (colors[idx] != "seagreen") {
                            let matchIndex = remainingLetters.indexOf(guess[idx]);

                            if (matchIndex != -1) {
                                colors[idx] = "yellow";
                                remainingLetters.splice(matchIndex, 1);
                            }
                        }
                    }

                    let won = true;

                    for (let idx = 0; idx < colors.length; idx++) {
                        blocks[idx].style.backgroundColor = colors[idx];

                        if (colors[idx] != "seagreen") {
                            won = false;
                        }
                    }

                    input.value = "";

                    if (won) {
                        let quitButton = document.querySelector('#quitButton');
                        let tryAgain = document.querySelector("#tryAgain");
                        form.innerHTML = "";
                        hint.style.visibility = "hidden";
                        quitButton.style.visibility = 'hidden';
                        tryAgain.style.visibility  = 'visible';
                        congrats.innerHTML = 'Congratulations! You guessed the country correctly!';
                        return;
                    }

                    if (round <= 3) {
                        round++;
                        blocks = createRow(wordSpace);
                        inputBox(blocks, name, word, input, round, message, hint, sorry, congrats, wordSpace, messagelength);
                    } else {
                        let quitButton = document.querySelector('#quitButton');
                        form.innerHTML = "";
                        hint.style.visibility = 'hidden';
                        quitButton.style.visibility = 'hidden';
                        let tryAgain = document.querySelector("#tryAgain");
                        tryAgain.style.visibility = 'visible';
                        sorry.innerHTML = 'Sorry, the country was ' + name.toUpperCase();
                    }
                }
            }
            let tryAgain = document.querySelector("#tryAgain");
            tryAgain.onclick = function (event)
            {

            const hintButton = document.querySelector("#hintButton")

            }
            quitButton.onclick = function(event) {

                    no.style.visibility = 'hidden';
                    quitButton.style.visibility = 'hidden';
                    sureMessage.style.visibility = 'hidden';
                    await sleep(1800);
                    location.reload();
                }
                no.onclick = function(event){

                    hint.style.visibility = 'visible';

                    quitButton.style.visibility = 'visible';
                    sureMessage.style.visibility = 'hidden';
                }
            }

            let word = createWord(name);
            let wordSpace = createWordSpace(name);
            let blocks = createRow(wordSpace)
            let newRow = document.querySelector("#newRow");
            let form = document.createElement("form");
            let input = document.createElement("input");
            let messagelength = document.querySelector("#messagelength");
            messagelength.style.visibility = 'hidden';
            input.type = 'text';
            input.className = 'guess';
            input.maxLength = word.length;
            input.minLength = word.length;
            input.required = 'true';
            input.autocomplete = 'off';
            form.appendChild(input);
            newRow.appendChild(form);
            inputBox(blocks, name, word, input, 0, message, hint, sorry, congrats, wordSpace, messagelength);

        <div id = "accuracy"></div>
        <div id = "pic" class = "center"></div>
        <script>
            const accuracy = document.querySelector("#accuracy");
            const pic = document.querySelector("#pic");
            const result = JSON.parse(sessionStorage.getItem('quizResult'));
            const complete = JSON.parse(sessionStorage.getItem('quizComplete'));
            if (result)
            {
                const percent = Math.round((result.correct / result.total) * 100);
                if (complete)
                {
                    accuracy.textContent = 'Congrats! You completed the quiz with a score of ' + result.correct + '/' + result.total + ' or ' + percent + '%';
                }
                else
                {
                    accuracy.textContent = 'Congrats! You answered ' + result.correct + '/' + result.total + ' items with an accuracy of ' + percent + '%';
                }
                const img = document.createElement("img");
                img.style.width = '600px';
                img.style.height = '300px';
                img.style.marginBottom = '20px';
                img.alt = 'Flags image';
                img.src = 'flagimag.jpg';
                pic.appendChild(img);
            }
        </script>
        <div class="center">Click the Geowizard logo to go back to home, or one of the three options in the top right to continue having fun!</div>
    </body>

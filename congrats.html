<!DOCTYPE html>

        <link href="style.css" rel="stylesheet">
        <title>
            Congratulations!
        </title>
        <header class="logorow">
            <a href="index.html" class= "link"><h4 class="logo">GeoWizard</h4></a>
            <a href="dailygame.html" class="link">Daily Game</a>
            <a href="flagpractice.html" class="link">Flag Practice</a>
            <a href="flagquiz.html" class="link">Flag Quiz</a>
        </header>        
    </head>
    <body>
        <div id = "accuracy"></div>
        <div id = "pic" class = "center"></div>
        <script>
            const accuracy = document.querySelector("#accuracy");
            const pic = document.querySelector("#pic");
            const result = JSON.parse(sessionStorage.getItem('quizResult'));
            if (result)
            {
                const percent = Math.round((result.correct / result.total) * 100);
                accuracy.textContent = 'Congrats! You answered ' + result.correct + '/' + result.total + ' flags with an accuracy of ' + percent + '%';
                const img = document.createElement("img");
                img.style.width = '600px';
                img.style.height = '300px';
                img.style.marginBottom = '20px';
                img.src = 'https://tse1.mm.bing.net/th/id/OIP.tYl9RWWJo3Orvwsu4JXQUwHaEo?r=0&pid=Api&h=220&P=0';
                img.alt = 'Flag image';
                pic.appendChild(img);
            }
        </script>
        <div class="center">Click the Geowizard logo to go back to home, or one of the three options in the top right to continue having fun!</div>
    </body>

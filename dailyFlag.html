    <body id="quiz">
        <span class="titles">Flag of The Day</span>
        <div id="flags"></div>
        <div id="continue"></div>
        <form id="guessbox">
            <label for="guess">Which country is this?</label>
            <input id="guess" type="text" required>
        </form>
        <div>
            <span id="correct">Correct!</span>
        </div>
        <div>
            <span id="sorry">Incorrect</span>
        </div>
        <div class="stop">
            <a id="change">
                <button id="stop">Stop</button>
            </a>  
        </div>
    </body>

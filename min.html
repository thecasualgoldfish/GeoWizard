    <script src="script.js"></script>
    <script>
        let time = 61;
        let timer = document.querySelector("#timer");
        let current = document.querySelector("#current");
        setInterval(function() {
            time--;
            timer.innerHTML = 'You have ' + time + " seconds remaining";
            current.innerHTML = "Your current score is " + correct + "/" + total;
            if (time <= 0)
            {
                sessionStorage.setItem("quizResult", JSON.stringify({ correct, total }));
                sessionStorage.setItem("quizComplete", "false");
                window.location.href = 'congrats.html';
            }
        }, 1000);
        changeCountry(allFlags, previousFlags);
    </script>

            About_how_many_kilometers_long_is_the_Mississippi_River: "3730",
        }
        let previousQuestions = []

        function getQuestion(approximateQuestions){
            const entries = Object.entries(approximateQuestions);
            let question = entries[Math.floor(Math.random() * entries.length)];
            while (previousQuestions.includes(question[0]))
            {
                entries = Object.entries(approximateQuestions);
                question = entries[Math.floor(Math.random() * entries.length)];
            }
            return question;
        }
        function displayQuestion(question){
            let quest = document.querySelector("#question");
            let asked = question[0];
            quest.innerHTML = asked + "?";
            
        }

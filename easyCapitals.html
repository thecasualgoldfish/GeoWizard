    <script>
        const easyCapitals = {
            Argentina: "Buenos Aires",
            Australia: "Canberra",
            Austria: "Vienna",

            Canada: "Ottawa",

            Iran: "Tehran",
            Iraq: "Baghdad",
            Ireland: "Dublin",
            Israel: "Jerusalem",
            Italy: "Rome",
            Japan: "Tokyo",
            Kenya: "Nairobi",
            Malaysia: "Kuala Lumpur",
            Mexico: "Mexico City",
            Morocco: "Rabat",
            Netherlands: "Amsterdam",
            New_Zealand: "Wellington",
            Nigeria: "Abuja",
            Norway: "Oslo",
            Pakistan: "Islamabad",
            Peru: "Lima",
            Philippines: "Manila",
            Poland: "Warsaw",
            Portugal: "Lisbon",
            Russia: "Moscow",
            Saudi_Arabia: "Riyadh",
            Singapore: "Singapore",
            South_Africa: "Pretoria",
            South_Korea: "Seoul",
            Spain: "Madrid",
            Sweden: "Stockholm",
            Switzerland: "Bern",
            Thailand: "Bangkok",
            Turkey: "Ankara",
            Ukraine: "Kyiv",
            United_Arab_Emirates: "Abu Dhabi",
            United_Kingdom: "London",
            United_States: "Washington, D.C.",
            Vietnam: "Hanoi"
        };

        function sleep(time)
        {
            return new Promise((resolve) => setTimeout(resolve, time));
        }

        function randomCountry(easyCapitals, previousCapitals)
        {
            const countries = Object.keys(easyCapitals);
            let name = countries[Math.floor(Math.random() * countries.length)];
            let capital = easyCapitals[name];
            while (previousCapitals.includes(name))
            {
                name = countries[Math.floor(Math.random() * countries.length)];
                capital = easyCapitals[name];    
            }
            return [name, capital];
        }
        let correct = 0;
        let total = 0;
        const guessInput = document.querySelector("#text");
        let previousCapitals = [];

        function changeCountryCapital(easyCapitals, previousCapitals) {
            let right = document.querySelector("#correct");
            let sorry = document.querySelector("#sorryMessage");
            const form = document.querySelector("#text-box");
            const stop = document.querySelector("#stop");
            let change = document.querySelector("#change");
            let topText = document.querySelector("#top-text");
            let current = document.querySelector("#currentScore");
            const [country, capital] = randomCountry(easyCapitals, previousCapitals);
            topText.innerHTML = 'What is the capital of ' + country.replaceAll("_", " ") + '?'; 

            right.style.visibility = 'hidden';
            sorry.style.visibility = 'hidden';
        
            form.onsubmit = async function (event) {
                event.preventDefault();
                if (easyCapitals[country].toLowerCase().replaceAll("_", " ") == guessInput.value.toLowerCase().trim() || easyCapitals[country].toLowerCase().replaceAll("_", " ") == 'washington, d.c.' && guessInput.value.toLowerCase().trim() == 'washington dc')
                {
                    right.style.visibility = 'visible';
                    guessInput.value = "";
                    await sleep(750);
                    correct++;
                    
                }
                else
                {
                    sorry.style.visibility = 'visible';
                    guessInput.value = "";
                    sorry.innerHTML = 'Incorrect, it is ' + easyCapitals[country].replaceAll("_", " ");
                    await sleep(1500);
                }
                total++;
                previousCapitals.push(country);
                if (previousCapitals.length == (Object.keys(easyCapitals).length))
                {
                    sessionStorage.setItem('quizResult', JSON.stringify({correct , total}));
                    sessionStorage.setItem('quizComplete', true);
                    window.location.href = "congrats.html";
                    return;
                }
                else 
                {
                    changeCountryCapital(easyCapitals, previousCapitals);
                }
            }
            stop.onclick = async function (event) {
                if (total == 0)
                {
                    alert("Please answer atleast 1 question.");
                    return;
                }
                change.href = 'congrats.html';
                sessionStorage.setItem('quizResult', JSON.stringify({correct , total}));
            }
        }
        changeCountryCapital(easyCapitals, previousCapitals);  
        
        let isHard = false;
        let hint = false;
        let isEasy = false;
        let isMedium = false;
        let dont = false;
        let daily = false;
    </script>

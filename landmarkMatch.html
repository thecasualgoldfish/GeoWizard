    <script>
        
        const landmarks = {
            Taj_Mahal: 'tajmahal.png',
            Eiffel_Tower: 'eiffeltower.png',
            Statue_of_Liberty: 'statue.png',
            Pyramids_of_Giza: 'pyramids.png',
            Great_Wall_of_China: 'wall.png',
            Roman_Colosseum: 'roman.png',
            Christ_the_Redeemer: 'christ.png',
            Grand_Canyon: 'grandcanyon.png',
            Mount_Everest: 'mounteverest.png',
            Machu_Picchu: 'machuupichu.png',
            Golden_Gate_Bridge: 'golden.png',
            Stonehenge: 'stonehenge.png',
            Leaning_Tower_of_Pisa: 'leaningtower.png',
            Mount_Fuji: 'mountfuji.png',
            Sydney_Opera_House: 'sydneyopera.png'

        }
        let matched = 0;
        function shuffleArray(array) {
            const newArray = array;
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }
        function connectImages() {
            const cards = Array.from(document.querySelectorAll(".photo-card"));
            const selectedPairs = shuffleArray(Object.entries(landmarks))
            .slice(0, 9)
            .flatMap(([country, src]) => [
            { country, kind: "flag", value: src },
            { country, kind: "name", value: country.replaceAll("_", " ") }
            ]);

            const shuffledPairs = shuffleArray(selectedPairs);

            cards.forEach((card, i) => {
                const pair = shuffledPairs[i];
                if (!pair) {
                    return;
                }

                card.dataset.country = pair.country;
                card.dataset.kind = pair.kind;

                card.innerHTML = '';

                if (pair.kind === "flag") {
                    const picture = document.createElement("img");
                    picture.className = "card-picture";
                    picture.src = pair.value;
                    picture.alt = pair.country;
                    picture.style.visibility = "hidden";
                    card.appendChild(picture);
                } else {
                    const text = document.createElement("h1");
                    text.className = "card-text"; 
                    text.textContent = pair.value;
                    text.style.visibility = "hidden";
                    card.appendChild(text);
                }
            });

            document.querySelectorAll(".photo-card").forEach(card => {
                card.addEventListener("click", () => onCardClick(card));
            });
        }

        let firstCard = null;
        let locked = false;
        let tryAgain = document.querySelector("#try");
        let congrat = document.querySelector("#congrat");
        tryAgain.style.visibility = 'hidden';
        congrat.style.visibility = 'hidden';

        function onCardClick(card) {
            if (locked || card.disabled || card === firstCard) {
                return;
            }

            const children = card.querySelectorAll(".card-picture, .card-text");
            children.forEach(element => {
                element.style.visibility = "visible";
            });

            if (!firstCard) {
                firstCard = card;
                return;
            }

            const previousCard = firstCard;
            firstCard = null;

            const match = card.dataset.country === previousCard.dataset.country && card.dataset.kind !== previousCard.dataset.kind;

            if (match) {
                card.disabled = true;
                previousCard.disabled = true;
                matched+=1;
                if (matched == 9){
                    tryAgain.style.visibility = 'visible';
                    congrat.style.visibility = 'visible';
                    tryAgain.onclick = function(event){
                        location.reload();
                    }
                }
                return;
            }

            locked = true;

            setTimeout(() => {
                card.querySelectorAll(".card-picture, .card-text").forEach(element => {
                    element.style.visibility = "hidden";
                });

                previousCard.querySelectorAll(".card-picture, .card-text").forEach(element => {
                    element.style.visibility = "hidden";
                });

                locked = false;
            }, 700);
        }
        connectImages();

    </script>

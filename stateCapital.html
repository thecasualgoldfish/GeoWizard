    <script>
        const stateCapitals = {
            Alabama: "Montgomery",
            Alaska: "Juneau",
            Arizona: "Phoenix",
            Arkansas: "Little Rock",
            California: "Sacramento",
            Colorado: "Denver",
            Connecticut: "Hartford",
            Delaware: "Dover",

            Hawaii: "Honolulu",

            Illinois: "Springfield",
            Indiana: "Indianapolis",
            Iowa: "Des Moines",
            Kansas: "Topeka",
            Kentucky: "Frankfort",
            Louisiana: "Baton Rouge",
            Maine: "Augusta",
            Maryland: "Annapolis",
            Massachusetts: "Boston",
            Michigan: "Lansing",
            Minnesota: "Saint Paul",
            Mississippi: "Jackson",
            Missouri: "Jefferson City",
            Montana: "Helena",
            Nebraska: "Lincoln",
            Nevada: "Carson City",
            New_Hampshire: "Concord",
            New_Jersey: "Trenton",
            New_Mexico: "Santa Fe",
            New_York: "Albany",
            North_Carolina: "Raleigh",
            North_Dakota: "Bismarck",
            Ohio: "Columbus",
            Oklahoma: "Oklahoma City",
            Oregon: "Salem",
            Pennsylvania: "Harrisburg",
            Rhode_Island: "Providence",
            South_Carolina: "Columbia",
            South_Dakota: "Pierre",
            Tennessee: "Nashville",
            Texas: "Austin",
            Utah: "Salt Lake City",
            Vermont: "Montpelier",
            Virginia: "Richmond",
            Washington: "Olympia",
            West_Virginia: "Charleston",
            Wisconsin: "Madison",
            Wyoming: "Cheyenne"
        };

        function sleep(time)
        {
            return new Promise((resolve) => setTimeout(resolve, time));
        }

        function randomCountry(stateCapitals, previousCapitals)
        {
            const countries = Object.keys(stateCapitals);
            let name = countries[Math.floor(Math.random() * countries.length)];
            let capital = stateCapitals[name];
            while (previousCapitals.includes(name))
            {
                name = countries[Math.floor(Math.random() * countries.length)];
                capital = stateCapitals[name];    
            }
            return [name, capital];
        }
        let correct = 0;
        let total = 0;
        const guessInput = document.querySelector("#text");
        let previousCapitals = [];

        function changeCountryCapital(stateCapitals, previousCapitals) {
            let right = document.querySelector("#correct");
            let sorry = document.querySelector("#sorryMessage");
            const form = document.querySelector("#text-box");
            const stop = document.querySelector("#stop");
            let change = document.querySelector("#change");
            let topText = document.querySelector("#top-text");
            let current = document.querySelector("#currentScore");
            const [country, capital] = randomCountry(stateCapitals, previousCapitals);
            topText.innerHTML = 'What is the capital of ' + country.replaceAll("_", " ") + '?'; 

            right.style.visibility = 'hidden';
            sorry.style.visibility = 'hidden';
        
            form.onsubmit = async function (event) {
                event.preventDefault();
                if (stateCapitals[country].toLowerCase().replaceAll("_", " ") == guessInput.value.toLowerCase().trim())
                {
                    right.style.visibility = 'visible';
                    guessInput.value = "";
                    await sleep(750);
                    correct++;
                    
                }
                else
                {
                    sorry.style.visibility = 'visible';
                    guessInput.value = "";
                    sorry.innerHTML = 'Incorrect, it is ' + stateCapitals[country].replaceAll("_", " ");
                    await sleep(1500);
                }
                total++;
                previousCapitals.push(country);
                if (previousCapitals.length == (Object.keys(stateCapitals).length))
                {
                    sessionStorage.setItem('quizResult', JSON.stringify({correct , total}));
                    sessionStorage.setItem('quizComplete', true);
                    window.location.href = "congrats.html";
                    return;
                }
                else 
                {
                    changeCountryCapital(stateCapitals, previousCapitals);
                }
            }
            stop.onclick = async function (event) {
                if (total == 0)
                {
                    alert("Please answer atleast 1 question.");
                    return;
                }
                change.href = 'congrats.html';
                sessionStorage.setItem('quizResult', JSON.stringify({correct , total}));
            }
        }
        changeCountryCapital(stateCapitals, previousCapitals);  
        
        let isHard = false;
        let hint = false;
        let daily = false;
        let isEasy = false;
        let dont = false;
        let isMedium = false;
    </script>

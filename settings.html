<!DOCTYPE html>
<html lang="en">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="style.css" rel="stylesheet">
        <title id="title">
            Settings
        </title>
    </head>
    <body id="quiz">
         <div class="nav-overflow" data-bs-toggle="nav-overflow">
            <ul class="nav nav-pills">
                <li class="nav-item">
                <a class="nav-link" aria-current="page" href="index.html">GeoWizard</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="dailygame.html">Games</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="flagpractice.html">Flag Practice</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="quizSelector.html">Quizzes</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="settings.html">Settings</a>
                </li>
            </ul>
        </div>
        <div class="statementquiz">Settings</div>
        <div class="center">
            <button id="dark">Click here to change to GeoWizard Dark Mode</button>
        </div>
    </body>
    <script>
        let headers = document.querySelectorAll(".nav-pills");
        let items = document.querySelectorAll(".nav-item");
        let dark = document.querySelector("#dark")
        let body = document.querySelector("#quiz");
        let theme = localStorage.getItem("theme") ?? "white";
        if (theme == "black") {
            body.style.backgroundColor = "black";
            dark.textContent = 'Click here to change to GeoWizard Light Mode';
            body.style.color = "whitesmoke";
            dark.style.backgroundColor = "#1e1c1c";
            dark.style.color = "whitesmoke";
            headers.forEach((header) => {
                header.style.backgroundColor = "#1e1c1c";
            })
            items.forEach((item) => {
                item.style.backgroundColor = "#1e1c1c";
            })
        }
        else {
            body.style.color = "black";
            body.style.backgroundColor = "whitesmoke";
            headers.forEach((header) => {
                header.style.backgroundColor = "black";
            })
            items.forEach((item) => {
                item.style.backgroundColor = "black";
            })
            dark.textContent = "Click here to change to GeoWizard Dark Mode";
        }

        dark.onclick = function(event) {
            if (dark.textContent == 'Click here to change to GeoWizard Light Mode')
            {
                dark.textContent = "Click here to change to GeoWizard Dark Mode";
                body.style.backgroundColor = "whitesmoke";
                dark.style.color = "black";
                dark.style.backgroundColor = "whitesmoke";
                body.style.color = "black";
                localStorage.setItem("theme", "white");
            }
            else {
                body.style.backgroundColor = "black";
                dark.textContent = 'Click here to change to GeoWizard Light Mode';
                body.style.color = "whitesmoke";
                dark.style.backgroundColor = "#1e1c1c";
                dark.style.color = "whitesmoke";
                localStorage.setItem("theme", "black");
            }
        }
        
    </script>

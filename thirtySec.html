    <body id="quiz">
        <span class="titles">Thirty Second Quiz</span>
        <div id="flags"></div>
        <div id="continue"></div>
        <form id="guessbox">
            <label id='quest' for="guess">Which country is this?</label>
            <input id="guess" type="text" required>
        </form>
        <div>
            <span id="correct">Correct!</span>
        </div>
        <div>
            <span id="sorry">Incorrect</span>
        </div>

        <div id = 'timer' class="center"></div>
        <div id="current" class='center'></div>
    </body>
    <script> 
        let isEurope = false;
        let isAsia = false;
        let hint = false;
        let isNorthA= false;
        let isOceania = false;
        let isSouthA = true;
        let isAfrica = false;
        let daily = false;
        let isEasy = false;
        let dont = true;
        let isMedium = false;
        let isHard = false;
    </script>
    <script src="script.js"></script>
    <script>
        let time = 31;
        let timer = document.querySelector("#timer");
        let current = document.querySelector("#current");
        setInterval(function() {
            time--;
            timer.innerHTML = 'You have ' + time + " seconds remaining";
            current.innerHTML = "Your current score is " + correct + "/" + total;
            if (time <= 0)
            {
                sessionStorage.setItem("quizResult", JSON.stringify({ correct, total }));
                sessionStorage.setItem("quizComplete", "false");
                window.location.href = 'congrats.html';
            }
        }, 1000);
        changeCountry(allFlags, previousFlags);
    </script>

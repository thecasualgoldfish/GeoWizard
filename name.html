        function changeTop(topText, letter)
        {
            topText.textContent = "Name a country starting with the letter " + letter;
        }
        let topText = document.querySelector("#top-text");
        let message = document.querySelector("#message");
        let sorryMessage = document.querySelector("#sorryMessage");
        let form = document.querySelector("#text-box");
        let input = document.querySelector("#text");
        let current = document.querySelector("#currentScore");
        let correct = 0;
        let total = 0;
        let right = false;
        let i = 65;
        function sleep(time)
        {
            return new Promise((resolve) => setTimeout(resolve, time));
        }
        function changeLetter(topText, message, sorryMessage, i, current) 
        {
            if (i > 90)
            {
                sessionStorage.setItem('quizResult', JSON.stringify({correct , total}));
                sessionStorage.setItem('quizComplete', true);
                window.location.href = 'congrats.html';
            }
            if (i == 88)
            {
                i++;
            }
            let letter = String.fromCharCode(i);
            message.style.visibility = 'hidden';
            sorryMessage.style.visibility = 'hidden';
            topText.innerHTML = "Name a country starting with the letter " + letter;
            if (i > 65)
            {
                current.innerHTML = "Your current score is " + correct + "/" + total;
            }
        }
        form.onsubmit = async function(event)
        {
            let letter = String.fromCharCode(i);
            event.preventDefault();
            if (countryNames.includes(input.value.trim().toLowerCase()) && input.value.startsWith(letter.toLowerCase()))
            {
                message.style.visibility = 'visible';
                i++;
                correct++;
                await sleep(1000);
                input.value = "";
            }
            else
            {
                sorryMessage.innerHTML = 'Sorry, incorrect';
                sorryMessage.style.visibility = 'visible';
                i++;
                await sleep(1000);
                input.value = "";
            }
            total++;
            changeLetter(topText, message, sorryMessage, i, current);
        } 
        changeLetter(topText, message, sorryMessage, i, current); 
        let isHard = false;
